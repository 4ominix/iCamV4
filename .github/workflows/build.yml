name: Build VCamFree

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid make
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Fetch iOS SDK
        run: |
          SDK_URL="https://github.com/theos/sdks/archive/master.tar.gz"
          mkdir -p $THEOS/sdks
          curl -sL "$SDK_URL" | tar xz -C $THEOS/sdks --strip-components=1
          ls $THEOS/sdks/

      - name: Build package
        run: |
          export PATH="$THEOS/bin:$(brew --prefix make)/libexec/gnubin:$PATH"
          make package FINALPACKAGE=1 2>&1
        env:
          THEOS: ${{ env.THEOS }}

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCamFree-deb
          path: packages/*.deb
          if-no-files-found: error
